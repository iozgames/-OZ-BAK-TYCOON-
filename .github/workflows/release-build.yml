name: İmzalı Release Derle

on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: NPM bagimliliklarini yukle
        run: npm install

      - name: Android platformunu ekle
        run: npx cap add android

      - name: Uygulama ikonunu olustur
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f2745' --iconBackgroundColorDark '#0f2745'

      - name: Unity Ads koprusunu (MainActivity) uygula
        run: |
          cp patches/MainActivity.java android/app/src/main/java/com/yapayzekapolat1/bankakur/MainActivity.java

      - name: Unity Ads bagimliligini build.gradle'a ekle
        run: |
          sed -i "/dependencies {/a\\    implementation 'com.unity3d.ads:unity-ads:4.+'" android/app/build.gradle

      - name: Web dosyalarini Android projesine kopyala
        run: npx cap sync android
      - name: Config ayarlarini uygula
        run: npx cap update android
  

      - name: Keystore dosyasini geri olustur
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Imzalama ayarlarini build.gradle'a ekle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Gradle wrapper izinlerini ayarla
        run: chmod +x android/gradlew

      - name: Release AAB derle (Play Store icin)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Imzali release APK derle (kendi telefonunda test icin)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Ciktilari paylas
        uses: actions/upload-artifact@v4
        with:
          name: ioz-bank-tycoon-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
